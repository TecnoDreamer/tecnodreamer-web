# Sobe o site em um container de produção local: `docker compose up -d --build`
# Acesse em http://localhost:3000. Detalhes em docs/DEPLOY.md ("Docker").
services:
  web:
    build:
      context: .
      args:
        # Embutida no build; mude aqui (ou no ambiente) e reconstrua a imagem.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: tecnodreamer-web:local
    container_name: tecnodreamer-web
    ports:
      - "${PORT:-3000}:3000"
    # Variáveis do formulário de contato (RESEND_API_KEY, CONTACT_TO_EMAIL...)
    # vêm de um .env.local opcional, que fica fora do git. Sem chave, o
    # formulário responde 503 de propósito (é o comportamento de produção);
    # para só validar e registrar as mensagens, ponha CONTACT_DELIVERY_MODE=log
    # no .env.local.
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped
